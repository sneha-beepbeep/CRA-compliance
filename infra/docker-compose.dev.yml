# Local development stack: PostgreSQL 16 + Keycloak 26 (EU-hosted in staging/prod).
#   docker compose -f infra/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://tracker:tracker@127.0.0.1:5432/tracker python manage.py migrate
# Not tested in the build environment (no Docker available there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./keycloak/tracker-realm.json:/opt/keycloak/data/import/tracker-realm.json:ro"]
volumes:
  pgdata: {}
