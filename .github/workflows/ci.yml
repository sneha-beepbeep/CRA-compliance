name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracker
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tracker:tracker@127.0.0.1:5432/tracker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group browser
      # Chromium for the Playwright drill flow and the axe-core pass (320 px and 1280 px).
      - run: uv run playwright install --with-deps chromium
      # Run 1, connected as the database owner: unit, property, golden, copy-lint, isolation,
      # route matrix, integration, static a11y, browser e2e and axe. Isolation blocks merges.
      - name: pytest (owner connection, incl. browser tests)
        run: uv run pytest -ra
      # Run 2 (QA-01): every test-client request goes through a NON-superuser login role set
      # up exactly as db/sql/db_roles.sql specifies (app_auth INHERIT TRUE; app_vendor and
      # app_customer INHERIT FALSE, SET TRUE). Catches grants/policies the owner would bypass.
      - name: pytest (production login role)
        run: uv run pytest -ra -m "postgres and not browser"
        env:
          TEST_LOGIN_ROLE: tracker_ci_app
      - run: uv run bandit -q -r apps tracker -x tests
      - run: uv run pip-audit --strict
      - run: uv run python manage.py makemigrations --check --dry-run --settings=tracker.settings.test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
